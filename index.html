<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102c49">
<meta name="description" content="درگاه سازمانی شرکت خدمات شهری شهر بهشت">
<title>شرکت خدمات شهری شهر بهشت | درگاه سازمانی</title>
<link rel="preload" href="assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/company-intro.css?v=intro-layout-v6-20261109">
<script src="assets/js/company-gateway.js?v=intro-layout-v7-20261109" defer></script>
</head>
<body class="company-gateway">
<main class="intro">
 <section class="intro-main">
  <div class="intro-brand">
   <div class="intro-logo-box"><img src="assets/images/logo.webp" alt="نشان شرکت" class="intro-logo"></div>
  </div>
 </section>
 <section class="intro-portal-box" aria-label="درگاه‌های سازمانی">
 <nav class="portal-grid" aria-label="درگاه‌های سازمانی">
  <button class="portal-card portal-enabled" type="button" data-open-login>
   <span class="portal-index">۰۱</span><span class="portal-title">رصد و اشراف</span><span class="portal-state">ورود <b>←</b></span>
  </button>
  <button class="portal-card" type="button" disabled>
   <span class="portal-index">۰۲</span><span class="portal-title">بانک و سامانه‌ها</span><span class="portal-state">به‌زودی</span>
  </button>
  <button class="portal-card" type="button" disabled>
   <span class="portal-index">۰۳</span><span class="portal-title">اقدامات</span><span class="portal-state">به‌زودی</span>
  </button>
  <button class="portal-card" type="button" disabled>
   <span class="portal-index">۰۴</span><span class="portal-title">ابزارها و امکانات عمومی</span><span class="portal-state">به‌زودی</span>
  </button>
 </nav>
 <a class="companies-link" href="companies.html">ورود به شرکت‌های دیگر <span aria-hidden="true">←</span></a>
 </section>
</main>

<div class="login-overlay" id="login-overlay" hidden>
 <button class="login-backdrop" type="button" data-close-login aria-label="بستن پنجره ورود"></button>
 <section class="login-panel" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <button class="login-close" type="button" aria-label="بستن" data-close-login>×</button>
  <div class="login-brand">
   <img src="assets/images/logo.webp" alt="">
   <span>ورود کاربران</span>
  </div>
  <h2 id="login-title">ورود به رصد و اشراف</h2>
  <form id="gateway-login" novalidate>
   <label for="gateway-username">نام کاربری</label>
   <input id="gateway-username" name="username" autocomplete="username" placeholder="نام کاربری" required>
   <label for="gateway-password">رمز عبور</label>
   <div class="password-field">
    <input id="gateway-password" name="password" type="password" autocomplete="current-password" placeholder="رمز عبور" required>
    <button type="button" data-toggle-password aria-label="نمایش رمز عبور">نمایش</button>
   </div>
   <label for="gateway-role">سطح دسترسی</label>
   <select id="gateway-role" name="role" required>
    <option value="">انتخاب سطح دسترسی</option>
    <option value="president">رئیس</option>
    <option value="manager">مدیر اداره</option>
    <option value="expert">کارشناس</option>
    <option value="technical">فنی</option>
   </select>
   <button class="login-submit" type="submit">ورود به سامانه <span>←</span></button>
   <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
  </form>
 </section>
</div>
</body>
</html>
